name: Fehlerbericht
description: Reproduzierbaren Fehler melden
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduktion
      description: Schritte mit anonymisierten Testdaten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version oder Commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Windows-, .NET- und Visual-Studio-Version
